spring:
  application:
    name: hookrelay
  datasource:
    url: jdbc:postgresql://localhost:5432/hookrelay
    username: hook
    password: hook
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics