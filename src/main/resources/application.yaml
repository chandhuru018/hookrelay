spring:
  application:
    name: hookrelay
  datasource:
    url: jdbc:postgresql://localhost:5432/hookrelay
    username: hook
    password: hook
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  task:
    scheduling:
      pool:
        size: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

hookrelay:
  max-request-body-bytes: 262144
  retention:
    days: 7
  security:
    allow-private-targets: false
  admin:
    username: admin