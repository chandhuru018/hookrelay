services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hookrelay
      POSTGRES_USER: hook
      POSTGRES_PASSWORD: hook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hook -d hookrelay"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hookrelay
      SPRING_DATASOURCE_USERNAME: hook
      SPRING_DATASOURCE_PASSWORD: hook
      JAVA_OPTS: "-Xmx320m -XX:+UseSerialGC"
      HOOKRELAY_SECURITY_ALLOW_PRIVATE_TARGETS: "true"
      HOOKRELAY_RATE_LIMIT_API_LIMIT: "1000000"
      HOOKRELAY_RATE_LIMIT_API_WINDOW_SECONDS: "1"
      HOOKRELAY_ADMIN_PASSWORD: "${HOOKRELAY_ADMIN_PASSWORD:-local-dev-only}"
      HOOKRELAY_RETENTION_DAYS: "${HOOKRELAY_RETENTION_DAYS:-7}"
      HOOKRELAY_LIMITS_MAX_ENDPOINTS_PER_TENANT: "${HOOKRELAY_LIMITS_MAX_ENDPOINTS_PER_TENANT:-0}"
      HOOKRELAY_LIMITS_MAX_STORED_EVENTS_PER_TENANT: "${HOOKRELAY_LIMITS_MAX_STORED_EVENTS_PER_TENANT:-0}"
      HOOKRELAY_LIMITS_MAX_TOTAL_EVENTS: "${HOOKRELAY_LIMITS_MAX_TOTAL_EVENTS:-0}"
      HOOKRELAY_LIMITS_MAX_PAYLOAD_BYTES: "${HOOKRELAY_LIMITS_MAX_PAYLOAD_BYTES:-0}"

volumes:
  pgdata: